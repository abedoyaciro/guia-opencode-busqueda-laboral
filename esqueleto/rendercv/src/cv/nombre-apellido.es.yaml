# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
# CV de EJEMPLO. Reemplaza todo el contenido por el tuyo antes de postular.
# Estructura: una sección por bloque; el orden del archivo es el orden en el PDF.
# Los textos entre «...» son placeholders: RenderCV/Typst los imprime tal cual,
# así que bórralos al personalizar.
cv:
