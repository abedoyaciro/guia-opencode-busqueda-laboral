      producción académicos o laborales. Enfocado en monitoreo, diagnóstico de
      incidentes y documentación técnica. «Máximo 3-4 líneas.»
    experiencia:
    - company: Empresa Ejemplo
      position: Practicante de Soporte
      start_date: 2025-01
      end_date: 2025-06
      location: Remoto
